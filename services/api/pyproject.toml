[project]
name = "runathon-api"
version = "0.1.0"
description = "FastAPI backend for the AEPI Runathon philanthropy site"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.117.1",
  "uvicorn[standard]==0.35.0",
  "pydantic-settings==2.10.1",
  "sqlalchemy[asyncio]==2.0.43",
  "asyncpg==0.30.0",
  "httpx==0.28.1",
  "cryptography==45.0.6"
]

[project.optional-dependencies]
test = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0"
]

[project.scripts]
app = "main:app"

